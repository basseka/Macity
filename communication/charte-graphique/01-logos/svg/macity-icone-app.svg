<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2A1A4E"></stop>
      <stop offset="45%" stop-color="#1A0A38"></stop>
      <stop offset="100%" stop-color="#05030F"></stop>
    </radialGradient>

    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,30,123,0.55)"></stop>
      <stop offset="40%" stop-color="rgba(255,30,123,0.25)"></stop>
      <stop offset="100%" stop-color="rgba(255,30,123,0)"></stop>
    </radialGradient>

    
    <linearGradient id="pinBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF1E8E"></stop>
      <stop offset="55%" stop-color="#FF1E6E"></stop>
      <stop offset="100%" stop-color="#FF2E38"></stop>
