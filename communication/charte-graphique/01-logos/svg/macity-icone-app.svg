  <g transform="translate(212, 250) scale(3)">
    
    <path d="&#xA;      M 100 8&#xA;      C 145 8, 180 42, 180 86&#xA;      C 180 130, 152 158, 122 184&#xA;      C 113 192, 107 198, 103 202&#xA;      C 101 204, 99 204, 97 202&#xA;      C 93 198, 87 192, 78 184&#xA;      C 48 158, 20 130, 20 86&#xA;      C 20 42, 55 8, 100 8 Z" fill="url(#pinBody)"></path>
    
