<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; font-family:"Liberation Sans", Arial, sans-serif; background:#140a1c; overflow:hidden; }
  .card { position:relative; width:1080px; height:1350px; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; padding-top:44px;
    background:radial-gradient(ellipse at 50% 40%, #3a0f1e 0%, #140a1c 70%); }
  .pill { display:inline-flex; align-items:center; gap:12px; padding:14px 32px; border-radius:999px;
    background:rgba(40,22,52,.75); border:1.5px solid rgba(255,79,163,.45);
    color:#ff4fa3; font-weight:700; font-size:26px; letter-spacing:4px; }
  .brand { margin-top:22px; color:#fff; font-size:84px; font-weight:800; letter-spacing:6px; }
  .sub { margin-top:4px; color:#e6d9f2; font-size:30px; font-weight:700; letter-spacing:2px; }
  .photo { margin-top:24px; width:560px; height:522px; border-radius:28px; overflow:hidden;
    border:3px solid rgba(255,79,163,.55); box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 50px rgba(255,79,163,.18); }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .pct { margin-top:18px; color:#ff4fa3; font-size:150px; font-weight:800; line-height:1; letter-spacing:-5px;
    text-shadow:0 8px 40px rgba(255,79,163,.35); }
  .pct-sub { margin-top:4px; color:#fff; font-size:40px; font-weight:700; }
  .items { margin-top:10px; color:#e6d9f2; font-size:30px; font-weight:700; }
  .code { margin-top:20px; padding:16px 44px; border-radius:20px; border:3px dashed #ff4fa3; background:rgba(255,79,163,.1);
    color:#fff; font-size:34px; font-weight:800; letter-spacing:3px; }
  .foot { margin-top:22px; display:flex; justify-content:center; align-items:center; gap:14px; }
  .logo { width:48px; height:48px; border-radius:12px; background:#1e1228; border:1px solid rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; color:#ff4fa3; font-weight:800; font-size:26px; }
  .name { color:#fff; font-size:32px; font-weight:800; }
  .name span { color:#ff4fa3; }
  .handle { color:#8fb2ff; font-size:28px; font-weight:700; margin-left:18px; }
</style></head>
<body><div class="card">
  <div class="pill">🎁 OFFRE MACITY</div>
  <div class="brand">CHEF CHUAN</div>
  <div class="sub">Cuisine chinoise · Toulouse</div>
  <div class="photo"><img src="chef-chuan-photo.png" alt=""></div>
  <div class="pct">-20%</div>
  <div class="pct-sub">sur les nouilles et les entrées</div>
  <div class="items">🍜 Toutes les nouilles · 🥟 Entrées R1 à R6 et E1 à E5</div>
  <div class="code">SUR PRÉSENTATION DE TON CODE MACITY</div>
  <div class="foot"><div class="logo">M</div><div class="name">Ma<span>City</span></div><div class="handle">@macity.app</div></div>
</div></body></html>
