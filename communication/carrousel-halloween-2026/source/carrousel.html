<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
@font-face{font-family:P;src:url(Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:P;src:url(Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(Poppins-ExtraBold.ttf);font-weight:800}
:root{--or:#FF7A1A;--rose:#FF1E8E;--vi:#7B2FBE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#000}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:P,sans-serif;color:#fff;background:#0a0510}
.blur{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) brightness(.45) saturate(1.3)}
.tint{position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 40%,rgba(255,122,26,.18),transparent 70%),linear-gradient(180deg,rgba(10,5,16,.55),rgba(10,5,16,.2) 30%,rgba(10,5,16,.85) 68%,#0a0510 100%)}
.grain{position:absolute;inset:0;opacity:.15;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.top{position:absolute;top:44px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.top img{height:58px}
.top .pg{font:700 24px P;letter-spacing:3px;color:rgba(255,255,255,.75)}
.date{font:400 34px Creepster;color:var(--or);letter-spacing:2px}
.card{position:absolute;left:50%;top:130px;transform:translateX(-50%) rotate(var(--r,-2deg));z-index:2;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.7),0 0 0 3px rgba(255,255,255,.08),0 0 70px rgba(255,122,26,.35)}
.card img{display:block;height:740px;width:auto;max-width:820px;object-fit:cover}
.info{position:absolute;left:56px;right:56px;bottom:70px;z-index:3}
.rank{display:inline-block;font:800 22px P;letter-spacing:3px;color:#0a0510;background:var(--or);padding:6px 16px;border-radius:8px;margin-bottom:16px}
.name{font:800 66px/1.02 P;letter-spacing:-1px;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.meta{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px}
.chip{display:flex;align-items:center;gap:10px;font:600 27px P;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:10px 20px;border-radius:40px;backdrop-filter:blur(6px)}
.chip svg{width:26px;height:26px;fill:none;stroke:var(--or);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.price{background:var(--rose);border-color:var(--rose)}
.chip.price svg{stroke:#fff}
.addr{margin-top:14px;font:500 24px P;color:rgba(255,255,255,.7)}
.swipe{position:absolute;bottom:26px;right:56px;font:600 20px P;color:rgba(255,255,255,.55);letter-spacing:2px;z-index:3}
/* cover */
.cover .fan{position:absolute;top:150px;left:0;right:0;height:640px}
.cover .fan .card{top:40px}
.cover .fan .card img{height:540px;max-width:440px}
.cover .ttl{position:absolute;left:0;right:0;bottom:120px;text-align:center;z-index:4}
.cover .k{font:800 34px P;letter-spacing:10px;color:#fff;opacity:.9}
.cover .big{font:400 168px/0.9 Creepster;color:var(--or);text-shadow:0 0 40px rgba(255,122,26,.6),0 6px 0 #5a1f00;margin:10px 0 6px}
.cover .ville{font:800 64px/1 P;letter-spacing:-1px}
.cover .d{display:inline-block;margin-top:24px;font:700 30px P;background:#fff;color:#0a0510;padding:10px 28px;border-radius:40px}
.bat{position:absolute;fill:#000;opacity:.85;z-index:5}
/* fin */
.end .box{position:absolute;inset:150px 56px 70px;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:3}
.end h2{font:400 104px/0.95 Creepster;color:var(--or);text-shadow:0 0 30px rgba(255,122,26,.5)}
.end .l{margin-top:34px;width:100%;display:flex;flex-direction:column;gap:14px}
.end .row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:18px 26px;text-align:left}
.end .row b{font:700 30px P}
.end .row span{font:500 23px P;color:rgba(255,255,255,.7)}
.end .row i{font:700 24px P;font-style:normal;color:var(--or);white-space:nowrap;margin-left:16px}
.end .cta{margin-top:40px;display:flex;align-items:center;gap:26px;background:linear-gradient(135deg,#FF1E8E,#E91E63);border-radius:34px;padding:20px 22px 20px 40px;box-shadow:0 0 50px rgba(255,30,142,.5)}
.end .cta .t{font:800 40px/1.1 P;text-align:left}
.end .cta .t small{display:block;font:600 24px P;margin-top:6px;opacity:.95}
.end .qr{width:136px;height:136px;background:#fff;border-radius:18px;padding:7px}
.end .qr img{width:100%;height:100%}
.end .save{margin-top:26px;font:600 24px P;color:rgba(255,255,255,.7)}
</style></head><body><div id="root"></div>
<script>
const I={clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
tik:'<svg viewBox="0 0 24 24"><path d="M3 9V6h18v3a3 3 0 0 0 0 6v3H3v-3a3 3 0 0 0 0-6z"/></svg>'};
const E=[
 {id:4379923,n:'Hiboo Horror Night',v:'Hiboo Club',a:'23 rue Nicolas Bachelier',h:'0h - 6h',r:-2},
 {id:4085294,n:'Halloween Asylum',v:'La Voile Blanche',a:'Allée des Foulques',h:'23h30 - 4h',r:2},
 {id:4085293,n:'La Nuit des Diaboliques',v:'O Club by Charleston',a:'12 rue de la Pomme',h:'Dès minuit',r:-2},
 {id:4085291,n:'Shatta Land vs African Nightmare',v:'La Rivière Club',a:'90 route de Bayonne',h:'0h - 6h',p:'5 €',r:2},
 {id:4085299,n:'Downtown Horror Factory',v:'Downtown Factory',a:'14 bd Pierre-Paul Riquet',h:'Dès 23h',r:-2},
 {id:4379922,n:'Peur aux Caribe, acte 2',v:'Caribe Bar',a:'12 place Victor Hugo',h:'18h - 3h',r:2},
 {id:4412563,n:'Halloween Cruise',v:'Yacht de Toulouse',a:'5 bd de Bonrepos',h:'19h30 - 0h',r:-2},
 {id:1792045780452,n:'La Nuit Chair de Poule',v:'Biergarten, Saint-Orens',a:'Urban Nightmare Night 2',h:'22h - 3h',r:2},
 {id:4085297,n:'La Noche de los Muertos',v:"L'Atelier de l'Écharpe",a:"8 rue de l'Écharpe",h:'Samedi soir',r:-2},
 {id:4085296,n:'Halloween Outfit Party',v:'Urban Lab',a:'4 impasse Didier Daurat',h:'23h - 5h',r:2},
];
const T=E.length+2, k=parseInt(location.hash.slice(1)||'0');
const bat=(x,y,s,r)=>`<svg class="bat" style="left:${x}px;top:${y}px;width:${s}px;transform:rotate(${r}deg)" viewBox="0 0 100 50"><path d="M50 18c-3-6-3-10-3-10l-3 6c-6-2-10 0-10 0 2-6-2-12-2-12C26 10 14 10 0 8c8 6 12 14 12 22 4-4 10-4 14 0 2-4 8-6 12-2 2 6 8 10 12 14 4-4 10-8 12-14 4-4 10-2 12 2 4-4 10-4 14 0 0-8 4-16 12-22-14 2-26 2-32-4 0 0-4 6-2 12 0 0-4-2-10 0l-3-6s0 4-3 10z"/></svg>`;
const hdr=(i)=>`<div class="top"><img src="macity-logo-couleur-fond-sombre.png"><div class="date">31.10</div><div class="pg">${String(i+1).padStart(2,'0')}/${T}</div></div>`;
let h='';
if(k===0){
 const f=[4085293,4379923,4085291];
 h=`<div class="s cover"><div class="blur" style="background-image:url(photos/4379923.img)"></div><div class="tint"></div><div class="grain"></div>${hdr(0)}
 <div class="fan">
  <div class="card" style="--r:-12deg;margin-left:-250px"><img src="photos/${f[0]}.img"></div>
  <div class="card" style="--r:12deg;margin-left:250px"><img src="photos/${f[2]}.img"></div>
  <div class="card" style="--r:0deg;top:10px"><img src="photos/${f[1]}.img"></div>
 </div>
 ${bat(90,170,130,-15)}${bat(860,230,100,18)}${bat(780,120,60,5)}
 <div class="ttl"><div class="k">OÙ FÊTER</div><div class="big">Halloween</div><div class="ville">à Toulouse</div><div class="d">Samedi 31 octobre</div></div>
 <div class="swipe">SWIPE →</div></div>`;
}else if(k<=E.length){
 const e=E[k-1];
 h=`<div class="s"><div class="blur" style="background-image:url(photos/${e.id}.img)"></div><div class="tint"></div><div class="grain"></div>${hdr(k)}
 <div class="card" style="--r:${e.r}deg"><img src="photos/${e.id}.img"></div>
 <div class="info"><div class="rank">SOIRÉE ${k}/${E.length}</div><div class="name">${e.n}</div>
 <div class="meta"><div class="chip">${I.pin}${e.v}</div><div class="chip">${I.clock}${e.h}</div>${e.p?`<div class="chip price">${I.tik}${e.p}</div>`:''}</div>
 <div class="addr">${e.a}</div></div>
 <div class="swipe">SWIPE →</div></div>`;
}else{
 const o=[['Techno Horror x Plein Phare','Le Rex','Dès 23h55'],['Jetlag Halloween','Interference','Dès 22h55'],['Scary Party','La Couleur de la Culotte','Samedi soir'],['Bachatea Halloween','Danc\'in la Roseraie','Dès 21h30']];
 h=`<div class="s end"><div class="blur" style="background-image:url(photos/4085296.img)"></div><div class="tint" style="background:rgba(10,5,16,.75)"></div><div class="grain"></div>${hdr(k)}
 ${bat(70,130,110,-12)}${bat(900,160,80,15)}
 <div class="box"><h2>Et c'est pas fini</h2>
 <div class="l">${o.map(x=>`<div class="row"><div><b>${x[0]}</b><br><span>${x[1]}</span></div><i>${x[2]}</i></div>`).join('')}</div>
 <div class="cta"><div class="t">Toutes les soirées<br>sont sur MaCity<small>Télécharge l'app gratuitement</small></div><div class="qr"><img src="qr-code-macity-avec-logo-2000.png"></div></div>
 <div class="save">Enregistre ce post et partage-le à ta team 👻</div></div></div>`;
}
document.getElementById('root').innerHTML=h;
</script></body></html>
