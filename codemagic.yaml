# Codemagic CI/CD — build & upload MaCity (iOS) to App Store Connect.
#
# AVANT le premier build, dans l'interface Codemagic :
#  1. Teams/App settings ▸ Integrations ▸ App Store Connect ▸ Add key
#       → colle le .p8, le Key ID et l'Issuer ID. Donne-lui le nom : "CodemagicAppStoreKey"
#         (doit correspondre EXACTEMENT au nom utilisé ci-dessous).
#  2. Récupère l'« Apple ID » NUMÉRIQUE de l'app sur App Store Connect
#       (App ▸ App Information ▸ General Information ▸ Apple ID)
#       et mets-le dans APP_STORE_APPLE_ID ci-dessous.
#
# Le code généré (*.g.dart, *.freezed.dart) est gitignoré : le build le régénère
# via build_runner — ne pas retirer cette étape, sinon la compilation échoue.

workflows:
  ios-appstore:
    name: MaCity — iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    # Sans cache, chaque build re-télécharge tout pub-cache + tout le graphe
    # CocoaPods Firebase depuis zéro (principale cause des timeouts).
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/Pods
    integrations:
      app_store_connect: CodemagicAppStoreKey
    environment:
      # NOTE: pas de bloc `ios_signing` — il déclenche une recherche de profil
      # pré-existant au démarrage (échec immédiat). La signature est entièrement
      # gérée par le script "Set up code signing".
      groups:
        - appstore            # contient CERTIFICATE_PRIVATE_KEY (clé privée de distribution, secure)
      vars:
        APP_STORE_APPLE_ID: 6778110272
        BUNDLE_ID: "com.macity.app"
      flutter: stable
      xcode: latest          # fournit le SDK iOS 26 requis par Apple
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate code (freezed / json_serializable / drift)
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods
        # `cd ios && pod install` au lieu d'un `find` sur tout l'arbre : chemin
        # déterministe (indispensable pour que le cache ios/Pods serve à quelque
        # chose) et pas de scan de build/ ni des exemples de plugins.
        script: |
          cd ios
          pod install
      - name: Set up code signing (reuse stored distribution cert + App Store profile)
        script: |
          keychain initialize
          # Réutilise une clé privée FIXE stockée dans la variable Codemagic
          # CERTIFICATE_PRIVATE_KEY (groupe "appstore"). Le 1er build crée le
          # certificat avec cette clé ; les suivants le retrouvent (plus de
          # "409 You already have a current Distribution certificate").
          # Garde-fou : si la variable est vide, le fichier .pem l'est aussi et
          # app-store-connect bascule en mode interactif pour réclamer la clé —
          # le build reste bloqué jusqu'au timeout. On échoue tout de suite.
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERREUR: CERTIFICATE_PRIVATE_KEY est vide."
            echo "Vérifie que le groupe de variables 'appstore' est bien attaché"
            echo "à ce workflow et qu'il contient la clé privée de distribution."
            exit 1
          fi
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/dist_cert_key.pem
          # < /dev/null : toute autre invite éventuelle échoue au lieu d'attendre.
          app-store-connect fetch-signing-files "com.macity.app" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/dist_cert_key.pem \
            --create < /dev/null
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true     # dépose la build sur TestFlight
        submit_to_app_store: false     # passe à true quand tu veux soumettre à la review
      email:
        recipients:
          - basseka@yahoo.fr
        notify:
          success: true
          failure: true
